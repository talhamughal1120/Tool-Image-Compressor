<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JPG to WebP Converter Online - Free</title>

<meta name="description" content="Convert JPG images to WebP online for free. Fast, private and easy JPG to WebP converter with no image upload required.">

<meta name="keywords" content="JPG to WebP, JPG to WebP converter, convert JPG to WebP, image converter, WebP converter">

<meta name="robots" content="index, follow">

<meta name="author" content="Tool Image Compressor">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f8fafc);
    color: #111827;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 35px 18px;
}

.card {
    background: white;
    border-radius: 22px;
    padding: 35px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    margin: 0;
    font-size: 34px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin: 10px 0 30px;
}

.drop-zone {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px dashed #94a3b8;
    border-radius: 18px;
    padding: 45px 20px;
    text-align: center;
    cursor: pointer;
    background: #f8fafc;
    min-height: 180px;
}

.drop-icon {
    font-size: 45px;
    margin-bottom: 12px;
}

.drop-zone strong {
    display: block;
    width: 100%;
    font-size: 18px;
    margin-bottom: 8px;
}

.drop-zone span {
    display: block;
    width: 100%;
    color: #64748b;
    font-size: 14px;
}

input[type="file"] {
    display: none;
}

.preview-box {
    display: none;
    margin-top: 25px;
    text-align: center;
}

.preview-box img {
    max-width: 100%;
    max-height: 350px;
    border-radius: 14px;
    border: 1px solid #e2e8f0;
}

.file-name {
    margin-top: 10px;
    font-weight: bold;
    word-break: break-word;
}

.controls {
    display: none;
    margin-top: 25px;
    padding: 20px;
    background: #f8fafc;
    border-radius: 15px;
}

.control-title {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
    font-weight: bold;
}

input[type="range"] {
    width: 100%;
    cursor: pointer;
}

.buttons {
    text-align: center;
    margin-top: 25px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 22px;
    font-size: 16px;
    cursor: pointer;
    margin: 5px;
}

.convert-btn {
    background: #4f46e5;
    color: white;
}

.convert-btn:hover {
    background: #4338ca;
}

.download-btn {
    display: none;
    background: #16a34a;
    color: white;
}

.download-btn:hover {
    background: #15803d;
}

.clear-btn {
    background: #e2e8f0;
    color: #334155;
}

.result {
    display: none;
    margin-top: 25px;
    padding: 20px;
    border-radius: 15px;
    background: #f0fdf4;
    text-align: center;
}

.result strong {
    font-size: 20px;
}

.info {
    text-align: center;
    margin-top: 25px;
    color: #64748b;
    font-size: 14px;
    line-height: 1.6;
}

.footer {
    text-align: center;
    margin-top: 25px;
    color: #94a3b8;
    font-size: 13px;
}

@media (max-width: 600px) {

    .container {
        padding: 15px;
    }

    .card {
        padding: 22px;
    }

    h1 {
        font-size: 27px;
    }

    .drop-zone {
        padding: 35px 15px;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>JPG to WebP Converter Online</h1>

<p class="subtitle">
Convert JPG images to WebP quickly and easily.
</p>

<label class="drop-zone" id="dropZone" for="imageInput">

<div class="drop-icon">🖼️</div>

<strong>Click to choose a JPG image</strong>

<span>or drag & drop your image here</span>

</label>

<input
type="file"
id="imageInput"
accept="image/jpeg,.jpg,.jpeg"
>

<div class="preview-box" id="previewBox">

<img id="previewImage" alt="JPG image preview">

<div class="file-name" id="fileName"></div>

</div>

<div class="controls" id="controls">

<div class="control-title">

<span>WebP Quality</span>

<span id="qualityValue">90%</span>

</div>

<input
type="range"
id="quality"
min="10"
max="100"
value="90"
>

</div>

<div class="buttons">

<button
class="convert-btn"
onclick="convertImage()"
>
Convert to WebP
</button>

<button
class="download-btn"
id="downloadButton"
onclick="downloadImage()"
>
Download WebP
</button>

<button
class="clear-btn"
onclick="clearImage()"
>
Clear
</button>

</div>

<div class="result" id="result">

<strong>Conversion Complete!</strong>

<p id="resultText"></p>

</div>

<p class="info">
🔒 Your image is processed directly in your browser.
<br>
Your image is not uploaded to our server.
</p>

</div>

<div class="footer">
JPG to WebP Converter • Fast • Private • No Upload
</div>

</div>

<script>

let selectedFile = null;
let convertedData = null;

const imageInput = document.getElementById("imageInput");
const dropZone = document.getElementById("dropZone");

const previewBox = document.getElementById("previewBox");
const previewImage = document.getElementById("previewImage");

const fileName = document.getElementById("fileName");

const controls = document.getElementById("controls");

const quality = document.getElementById("quality");
const qualityValue = document.getElementById("qualityValue");

const result = document.getElementById("result");
const resultText = document.getElementById("resultText");

const downloadButton =
document.getElementById("downloadButton");


quality.addEventListener("input", function() {

    qualityValue.textContent =
        quality.value + "%";

});


imageInput.addEventListener("change", function(event) {

    if (event.target.files.length > 0) {

        loadImage(event.target.files[0]);

    }

});


dropZone.addEventListener("dragover", function(event) {

    event.preventDefault();

});


dropZone.addEventListener("drop", function(event) {

    event.preventDefault();

    if (event.dataTransfer.files.length > 0) {

        loadImage(event.dataTransfer.files[0]);

    }

});


function loadImage(file) {

    if (
        file.type !== "image/jpeg" &&
        !file.name.toLowerCase().endsWith(".jpg") &&
        !file.name.toLowerCase().endsWith(".jpeg")
    ) {

        alert("Please choose a JPG image.");

        return;

    }

    selectedFile = file;

    fileName.textContent = file.name;

    const reader = new FileReader();

    reader.onload = function(event) {

        previewImage.src = event.target.result;

        previewBox.style.display = "block";

        controls.style.display = "block";

    };

    reader.readAsDataURL(file);

    result.style.display = "none";

    downloadButton.style.display = "none";

}


function convertImage() {

    if (!selectedFile) {

        alert("Please choose a JPG image first.");

        return;

    }

    const reader = new FileReader();

    reader.onload = function(event) {

        const img = new Image();

        img.onload = function() {

            const canvas =
                document.createElement("canvas");

            const ctx =
                canvas.getContext("2d");

            canvas.width = img.width;
            canvas.height = img.height;

            ctx.drawImage(
                img,
                0,
                0,
                img.width,
                img.height
            );

            convertedData =
                canvas.toDataURL(
                    "image/webp",
                    quality.value / 100
                );

            const base64 =
                convertedData.split(",")[1];

            const webpSize =
                Math.round(
                    (base64.length * 3) / 4
                );

            const originalSize =
                selectedFile.size;

            const saved =
                Math.max(
                    0,
                    Math.round(
                        (1 - webpSize / originalSize) * 100
                    )
                );

            resultText.textContent =
                "Original: " +
                formatBytes(originalSize) +
                " • WebP: " +
                formatBytes(webpSize) +
                " • Saved: " +
                saved +
                "%";

            result.style.display = "block";

            downloadButton.style.display =
                "inline-block";

        };

        img.src = event.target.result;

    };

    reader.readAsDataURL(selectedFile);

}


function downloadImage() {

    if (!convertedData) {

        return;

    }

    const link =
        document.createElement("a");

    link.href = convertedData;

    link.download = "converted-image.webp";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

}


function clearImage() {

    selectedFile = null;

    convertedData = null;

    imageInput.value = "";

    previewImage.src = "";

    fileName.textContent = "";

    previewBox.style.display = "none";

    controls.style.display = "none";

    result.style.display = "none";

    downloadButton.style.display = "none";

}


function formatBytes(bytes) {

    if (bytes === 0) {

        return "0 Bytes";

    }

    const sizes = [
        "Bytes",
        "KB",
        "MB",
        "GB"
    ];

    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );

    return (
        parseFloat(
            (
                bytes /
                Math.pow(1024, i)
            ).toFixed(2)
        ) +
        " " +
        sizes[i]
    );

}

</script>

</body>

</html>
