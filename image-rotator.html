<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="keywords" content="image rotator, rotate image online, flip image, image flipper, rotate jpg, rotate png, rotate webp">
  <meta name="robots" content="index, follow">

  <link rel="canonical" href="https://talhamughal1120.github.io/Tool-Image-Compressor/image-rotator.html">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      padding: 18px 15px;
      text-align: center;
    }

    header h1 {
      color: white;
      margin: 0 0 12px;
      font-size: 25px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 7px;

    }

    nav a:hover {

    }

    .container {
      max-width: 850px;
      margin: 35px auto;
      padding: 0 15px;
    }

    .box {
      background: white;

      padding: 25px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    .intro {
      text-align: center;
      margin-bottom: 25px;

    .intro h2 {
      margin-bottom: 10px;
    }

    .intro p {
      color: #666;

    }

    /* Upload Area - same style as previous tools */

    .upload-area {
      border: 2px dashed #aaa;
      border-radius: 10px;
      padding: 40px 20px;

      transition: 0.2s;
    }

    .upload-area:hover {
      border-color: #2563eb;

    }

    .upload-area p {
      margin: 8px 0;
    }

    .upload-main {
      font-size: 17px;
      font-weight: bold;
      color: #333;
    }

    .upload-sub {
      color: #777;
      font-size: 14px;
    }

    .upload-formats {
      color: #888;
      font-size: 13px;
      margin-top: 12px !important;
    }

    #fileInput {
      display: none;
    }

    .preview-box {
      margin-top: 25px;
      text-align: center;
      display: none;
    }

    .preview-box h3 {
      margin-bottom: 15px;
    }

    canvas {
      max-width: 100%;
      max-height: 500px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #eee;
    }

    .controls {
      margin-top: 25px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    button {
      border: none;

      border-radius: 8px;

    .rotate-btn {

    }

    .clear-btn {

    button:hover {

      cursor: not-allowed;
    }

    @media (max-width: 600px) {

      nav a {
        display: inline-block;

  </style>

<body>

<header>

  <h1>Free Image Tools</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="image-compressor.html">Compressor</a>
    <a href="image-resizer.html">Resizer</a>
    <a href="jpg-to-webp.html">JPG to WebP</a>
    <a href="png-to-jpg.html">PNG to JPG</a>
  </nav>

</header>

<div class="container">

  <div class="box">

    <div class="intro">

      <h2>Image Rotator & Flipper</h2>

      <p>
        Rotate or flip your image online for free.
        Supports JPG, PNG and WebP images.
      </p>

    </div>

    <!-- Upload Area -->

    <label for="fileInput" class="upload-area" id="uploadArea">

      <p class="upload-main">
        Click to upload an image
      </p>

      <p class="upload-sub">
        or drag & drop your image here
      </p>

      <p class="upload-formats">
        Supported formats: JPG, JPEG, PNG, WebP
      </p>

    </label>

    <input
      type="file"
      id="fileInput"
      accept="image/jpeg,image/png,image/webp"
    >

    <!-- Preview -->

    <div class="preview-box" id="previewBox">

      <h3>Preview</h3>

      <canvas id="canvas"></canvas>

      <div class="controls">

        <button
          class="rotate-btn"
          id="rotateLeft"
          disabled>
          ↺ Rotate Left
        </button>

        <button
          class="rotate-btn"
          id="rotateRight"
          disabled>
          ↻ Rotate Right
        </button>

        <button
          class="flip-btn"
          id="flipHorizontal"
          disabled>
          ↔ Flip Horizontal
        </button>

        <button
          class="flip-btn"
          id="flipVertical"
          disabled>
          ↕ Flip Vertical
        </button>

      </div>

      <button
        class="download-btn"
        id="downloadBtn"
        disabled>
        Download Image
      </button>

      <button
        class="clear-btn"
        id="clearBtn">
        Clear
      </button>

      <div class="info" id="info">
        Upload an image to start.
      </div>

    </div>

  </div>

</div>

<footer>
  © 2026 Free Image Tools. All processing happens in your browser.
</footer>

<script>

  const fileInput = document.getElementById("fileInput");
  const uploadArea = document.getElementById("uploadArea");

  const previewBox = document.getElementById("previewBox");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const rotateLeft = document.getElementById("rotateLeft");
  const rotateRight = document.getElementById("rotateRight");

  const flipHorizontal =
    document.getElementById("flipHorizontal");

  const flipVertical =
    document.getElementById("flipVertical");

  const downloadBtn =
    document.getElementById("downloadBtn");

  const clearBtn =
    document.getElementById("clearBtn");

  const info =
    document.getElementById("info");


  let originalImage = new Image();

  let rotation = 0;

  let flipX = 1;

  let flipY = 1;

  let fileName = "rotated-image";


  function handleFile(file) {

    if (!file) {
      return;
    }

    if (!file.type.match(/^image\/(jpeg|png|webp)$/)) {

      alert("Please select a JPG, PNG or WebP image.");

      return;
    }


    fileName = file.name.replace(/\.[^/.]+$/, "");


    const reader = new FileReader();


    reader.onload = function(e) {

      originalImage = new Image();


      originalImage.onload = function() {

        rotation = 0;

        flipX = 1;

        flipY = 1;


        previewBox.style.display = "block";


        rotateLeft.disabled = false;

        rotateRight.disabled = false;

        flipHorizontal.disabled = false;

        flipVertical.disabled = false;

        downloadBtn.disabled = false;


        drawImage();


        info.innerHTML =
          "Original size: " +
          originalImage.width +
          " × " +
          originalImage.height +
          " px";

      };


      originalImage.src = e.target.result;

    };


    reader.readAsDataURL(file);

  }


  function drawImage() {

    const angle =
      rotation * Math.PI / 180;


    const width =
      originalImage.width;

    const height =
      originalImage.height;


    if (rotation === 90 || rotation === 270) {

      canvas.width = height;

      canvas.height = width;

    } else {

      canvas.width = width;

      canvas.height = height;

    }


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.save();


    ctx.translate(
      canvas.width / 2,
      canvas.height / 2
    );


    ctx.rotate(angle);


    ctx.scale(
      flipX,
      flipY
    );


    ctx.drawImage(
      originalImage,
      -width / 2,
      -height / 2,
      width,
      height
    );


    ctx.restore();

  }


  rotateLeft.addEventListener(
    "click",
    function() {

      rotation -= 90;


      if (rotation < 0) {
        rotation = 270;
      }


      drawImage();

    }
  );


  rotateRight.addEventListener(
    "click",
    function() {

      rotation += 90;


      if (rotation >= 360) {
        rotation = 0;
      }


      drawImage();

    }
  );


  flipHorizontal.addEventListener(
    "click",
    function() {

      flipX *= -1;

      drawImage();

    }
  );


  flipVertical.addEventListener(
    "click",
    function() {

      flipY *= -1;

      drawImage();

    }
  );


  downloadBtn.addEventListener(
    "click",
    function() {

      if (!originalImage.src) {
        return;
      }


      canvas.toBlob(
        function(blob) {

          const url =
            URL.createObjectURL(blob);


          const link =
            document.createElement("a");


          link.href = url;


          link.download =
            fileName + "-rotated.png";


          document.body.appendChild(link);


          link.click();


          document.body.removeChild(link);


          URL.revokeObjectURL(url);

        },
        "image/png"
      );

    }
  );


  clearBtn.addEventListener(
    "click",
    function() {

      fileInput.value = "";


      previewBox.style.display = "none";


      rotateLeft.disabled = true;

      rotateRight.disabled = true;

      flipHorizontal.disabled = true;

      flipVertical.disabled = true;

      downloadBtn.disabled = true;


      rotation = 0;

      flipX = 1;

      flipY = 1;


      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      info.innerHTML =
        "Upload an image to start.";

    }
  );


  fileInput.addEventListener(
    "change",
    function() {

      if (fileInput.files.length > 0) {

        handleFile(
          fileInput.files[0]
        );

      }

    }
  );


  uploadArea.addEventListener(
    "dragover",
    function(e) {

      e.preventDefault();

      uploadArea.style.borderColor =
        "#2563eb";

      uploadArea.style.background =
        "#f5f9ff";

    }
  );


  uploadArea.addEventListener(
    "dragleave",
    function() {

      uploadArea.style.borderColor =
        "#aaa";

      uploadArea.style.background =
        "#fafafa";

    }
  );


  uploadArea.addEventListener(
    "drop",
    function(e) {

      e.preventDefault();


      uploadArea.style.borderColor =
        "#aaa";

      uploadArea.style.background =
        "#fafafa";


      if (e.dataTransfer.files.length > 0) {

        handleFile(
          e.dataTransfer.files[0]
        );

      }

    }
  );

</script>

</body>
</html>
