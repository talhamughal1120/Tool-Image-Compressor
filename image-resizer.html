<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Image Resizer Online - Resize JPG, PNG & WebP</title>

<meta name="description" content="Resize JPG, PNG and WebP images online for free. Change image width and height quickly and easily. Fast, private and no upload required.">

<meta name="keywords" content="image resizer, resize image online, image resize tool, JPG resizer, PNG resizer, WebP resizer">

<meta name="robots" content="index, follow">

<meta name="author" content="Tool Image Compressor">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f8fafc);
    color: #111827;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 35px 18px;
}

.card {
    background: white;
    border-radius: 22px;
    padding: 35px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    margin: 0;
    font-size: 34px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin: 10px 0 30px;
}

.drop-zone {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px dashed #94a3b8;
    border-radius: 18px;
    padding: 45px 20px;
    text-align: center;
    cursor: pointer;
    background: #f8fafc;
    min-height: 180px;
}

.drop-icon {
    font-size: 45px;
    margin-bottom: 12px;
}

.drop-zone strong {
    display: block;
    width: 100%;
    font-size: 18px;
    margin-bottom: 8px;
}

.drop-zone span {
    display: block;
    width: 100%;
    color: #64748b;
    font-size: 14px;
}

input[type="file"] {
    display: none;
}

.preview-box {
    display: none;
    margin-top: 25px;
    text-align: center;
}

.preview-box img {
    max-width: 100%;
    max-height: 350px;
    border-radius: 14px;
    border: 1px solid #e2e8f0;
}

.file-name {
    margin-top: 10px;
    font-weight: bold;
    word-break: break-word;
}

.original-size {
    margin-top: 8px;
    color: #64748b;
}

.controls {
    display: none;
    margin-top: 25px;
    padding: 20px;
    background: #f8fafc;
    border-radius: 15px;
}

.control-row {
    display: flex;
    gap: 15px;
    margin-bottom: 15px;
}

.control-group {
    flex: 1;
}

.control-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

.control-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    font-size: 16px;
}

.lock-row {
    text-align: center;
    margin-top: 10px;
}

.lock-row label {
    color: #475569;
    cursor: pointer;
}

.buttons {
    text-align: center;
    margin-top: 25px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 22px;
    font-size: 16px;
    cursor: pointer;
    margin: 5px;
}

.resize-btn {
    background: #4f46e5;
    color: white;
}

.resize-btn:hover {
    background: #4338ca;
}

.download-btn {
    display: none;
    background: #16a34a;
    color: white;
}

.download-btn:hover {
    background: #15803d;
}

.clear-btn {
    background: #e2e8f0;
    color: #334155;
}

.result {
    display: none;
    margin-top: 25px;
    padding: 20px;
    border-radius: 15px;
    background: #f0fdf4;
    text-align: center;
}

.result strong {
    font-size: 20px;
}

.info {
    text-align: center;
    margin-top: 25px;
    color: #64748b;
    font-size: 14px;
    line-height: 1.6;
}

.footer {
    text-align: center;
    margin-top: 25px;
    color: #94a3b8;
    font-size: 13px;
}

@media (max-width: 600px) {

    .container {
        padding: 15px;
    }

    .card {
        padding: 22px;
    }

    h1 {
        font-size: 27px;
    }

    .drop-zone {
        padding: 35px 15px;
    }

    .control-row {
        flex-direction: column;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Free Image Resizer Online</h1>

<p class="subtitle">
Resize JPG, PNG and WebP images quickly and easily.
</p>

<label class="drop-zone" id="dropZone" for="imageInput">

<div class="drop-icon">🖼️</div>

<strong>Click to choose an image</strong>

<span>or drag & drop your image here</span>

</label>

<input
type="file"
id="imageInput"
accept="image/jpeg,image/png,image/webp"
>

<div class="preview-box" id="previewBox">

<img id="previewImage" alt="Image preview">

<div class="file-name" id="fileName"></div>

<div class="original-size" id="originalDimensions"></div>

</div>

<div class="controls" id="controls">

<div class="control-row">

<div class="control-group">

<label for="width">Width (px)</label>

<input
type="number"
id="width"
min="1"
>

</div>

<div class="control-group">

<label for="height">Height (px)</label>

<input
type="number"
id="height"
min="1"
>

</div>

</div>

<div class="lock-row">

<label>
<input type="checkbox" id="lockRatio" checked>
 Lock aspect ratio
</label>

</div>

</div>

<div class="buttons">

<button
class="resize-btn"
onclick="resizeImage()"
>
Resize Image
</button>

<button
class="download-btn"
id="downloadButton"
onclick="downloadImage()"
>
Download Image
</button>

<button
class="clear-btn"
onclick="clearImage()"
>
Clear
</button>

</div>

<div class="result" id="result">

<strong>Resize Complete!</strong>

<p id="resultText"></p>

</div>

<p class="info">
🔒 Your image is processed directly in your browser.
<br>
Your image is not uploaded to our server.
</p>

</div>

<div class="footer">
Free Image Resizer • Fast • Private • No Upload
</div>

</div>

<script>

let selectedFile = null;
let resizedData = null;
let originalWidth = 0;
let originalHeight = 0;

const imageInput = document.getElementById("imageInput");
const dropZone = document.getElementById("dropZone");

const previewBox = document.getElementById("previewBox");
const previewImage = document.getElementById("previewImage");

const fileName = document.getElementById("fileName");
const originalDimensions = document.getElementById("originalDimensions");

const controls = document.getElementById("controls");

const widthInput = document.getElementById("width");
const heightInput = document.getElementById("height");

const lockRatio = document.getElementById("lockRatio");

const result = document.getElementById("result");
const resultText = document.getElementById("resultText");

const downloadButton = document.getElementById("downloadButton");


imageInput.addEventListener("change", function(event) {

    if (event.target.files.length > 0) {

        loadImage(event.target.files[0]);

    }

});


dropZone.addEventListener("dragover", function(event) {

    event.preventDefault();

});


dropZone.addEventListener("drop", function(event) {

    event.preventDefault();

    if (event.dataTransfer.files.length > 0) {

        loadImage(event.dataTransfer.files[0]);

    }

});


function loadImage(file) {

    if (!file.type.startsWith("image/")) {

        alert("Please choose a valid image.");

        return;

    }

    selectedFile = file;

    fileName.textContent = file.name;

    const reader = new FileReader();

    reader.onload = function(event) {

        previewImage.src = event.target.result;

        previewImage.onload = function() {

            originalWidth = previewImage.naturalWidth;
            originalHeight = previewImage.naturalHeight;

            widthInput.value = originalWidth;
            heightInput.value = originalHeight;

            originalDimensions.textContent =
                "Original size: " +
                originalWidth +
                " × " +
                originalHeight +
                " px";

            previewBox.style.display = "block";

            controls.style.display = "block";

        };

    };

    reader.readAsDataURL(file);

    result.style.display = "none";

    downloadButton.style.display = "none";

}


widthInput.addEventListener("input", function() {

    if (!lockRatio.checked) {

        return;

    }

    const newWidth = parseInt(widthInput.value);

    if (!newWidth || !originalWidth) {

        return;

    }

    const newHeight =
        Math.round(
            newWidth * originalHeight / originalWidth
        );

    heightInput.value = newHeight;

});


heightInput.addEventListener("input", function() {

    if (!lockRatio.checked) {

        return;

    }

    const newHeight = parseInt(heightInput.value);

    if (!newHeight || !originalHeight) {

        return;

    }

    const newWidth =
        Math.round(
            newHeight * originalWidth / originalHeight
        );

    widthInput.value = newWidth;

});


function resizeImage() {

    if (!selectedFile) {

        alert("Please choose an image first.");

        return;

    }

    const newWidth = parseInt(widthInput.value);
    const newHeight = parseInt(heightInput.value);

    if (!newWidth || !newHeight || newWidth < 1 || newHeight < 1) {

        alert("Please enter valid width and height.");

        return;

    }

    const reader = new FileReader();

    reader.onload = function(event) {

        const img = new Image();

        img.onload = function() {

            const canvas = document.createElement("canvas");

            const ctx = canvas.getContext("2d");

            canvas.width = newWidth;
            canvas.height = newHeight;

            ctx.drawImage(
                img,
                0,
                0,
                newWidth,
                newHeight
            );

            let format = selectedFile.type;

            if (
                format !== "image/jpeg" &&
                format !== "image/png" &&
                format !== "image/webp"
            ) {

                format = "image/jpeg";

            }

            resizedData = canvas.toDataURL(format, 0.92);

            resultText.textContent =
                "Image resized to " +
                newWidth +
                " × " +
                newHeight +
                " pixels.";

            result.style.display = "block";

            downloadButton.style.display = "inline-block";

        };

        img.src = event.target.result;

    };

    reader.readAsDataURL(selectedFile);

}


function downloadImage() {

    if (!resizedData) {

        return;

    }

    let extension = "jpg";

    if (selectedFile.type === "image/png") {

        extension = "png";

    }

    if (selectedFile.type === "image/webp") {

        extension = "webp";

    }

    const link = document.createElement("a");

    link.href = resizedData;

    link.download = "resized-image." + extension;

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

}


function clearImage() {

    selectedFile = null;

    resizedData = null;

    originalWidth = 0;
    originalHeight = 0;

    imageInput.value = "";

    previewImage.src = "";

    fileName.textContent = "";

    originalDimensions.textContent = "";

    widthInput.value = "";
    heightInput.value = "";

    previewBox.style.display = "none";

    controls.style.display = "none";

    result.style.display = "none";

    downloadButton.style.display = "none";

}

</script>

</body>

</html>
